apiVersion: 1

contactPoints:
  - orgId: 1
    name: fatigue-email
    receivers:
      - uid: fatigue-log-receiver
        type: email
        disableResolveMessage: true
        settings:
          addresses: "${GF_ALERT_EMAIL_TO}"
          singleEmail: true

policies:
  - orgId: 1
    receiver: fatigue-email
    group_by:
      - alertname
    group_wait: 0s
    group_interval: 10s
    repeat_interval: 10s

groups:
  - orgId: 1
    name: fatigue-alerts
    folder: Strava Alerts
    interval: 10s
    rules:
      - uid: fatigue-critical-alert
        title: "Zona Critica Fatica"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 15
              to: 0
            datasourceUid: elasticsearch-ds
            model:
              query: "fatigue_alert:true"
              timeField: "timestamp"
              bucketAggs:
                - type: date_histogram
                  field: timestamp
                  id: "2"
                  settings:
                    interval: "15s"
                    min_doc_count: "1"
              metrics:
                - type: count
                  id: "1"
          - refId: B
            relativeTimeRange:
              from: 15
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: sum
          - refId: C
            relativeTimeRange:
              from: 15
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 8
        noDataState: OK
        execErrState: OK
        for: 0s
        isPaused: false
        annotations:
          summary: "Il battito cardiaco dell'atleta supera la soglia di fatica prevista dal modello ML. Zona critica raggiunta."
          __dashboardUid__: "strava-stream-engine"
          __panelId__: "4"
        labels:
          severity: critical
